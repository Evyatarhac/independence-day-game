services:
  exporter:
    build:
      context: .
      dockerfile: Dockerfile.godot
    profiles: ["build"]
    volumes:
      - .:/project
    working_dir: /project
    command: ["sh", "-ec", "cp /project/.base44/export_presets.cfg /project/export_presets.cfg && godot --headless --path /project --import && mkdir -p /project/export/web && godot --headless --path /project --export-release 'Web' && sed -i 's/^html, body, #canvas {$/html, body { width:100%; height:100%; }\\nhtml, body, #canvas {/' /project/export/web/index.html"]
    environment:
      - GODOT_SILENCE_ROOT_WARNING=1

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./export/web:/usr/share/nginx/html:ro
      - ./nginx.godot.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/index.html"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
