server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Godot web export MIME types
    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        application/octet-stream pck;
        image/png png;
        image/jpeg jpg;
        image/svg+xml svg;
        audio/ogg oga ogg;
        video/ogg ogv;
        text/css css;
        font/woff2 woff2;
    }

    # Disable caching for dev — always serve fresh export
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri $uri/ =404;
    }

    # Large files (wasm, pck) — allow long responses
    location ~ \.(wasm|pck)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
